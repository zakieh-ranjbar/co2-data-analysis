[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "co2-data-analysis"
version = "1.0.0"
description = "Exploratory analysis and visualization of a vehicle CO2 dataset"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0,<3.0", "matplotlib>=3.7,<4.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
